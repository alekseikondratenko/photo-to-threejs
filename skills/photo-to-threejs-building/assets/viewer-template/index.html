<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo → Three.js — building reconstructions</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }
      body { font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; background: #0d1117; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 14px; left: 14px; z-index: 10;
        background: rgba(14, 18, 26, 0.82); color: #e6edf3;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
        padding: 12px 14px; backdrop-filter: blur(10px); max-width: 280px;
      }
      #hud h1 { font-size: 13px; letter-spacing: .01em; margin-bottom: 2px; }
      #hud p { font-size: 11px; color: #93a1b1; margin-bottom: 10px; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      .row + .row { margin-top: 6px; }
      .sep { height: 1px; background: rgba(255,255,255,0.12); margin: 10px 0; }
      button {
        font: inherit; font-size: 11px; cursor: pointer; color: #e6edf3;
        background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
        border-radius: 6px; padding: 5px 9px;
      }
      button:hover { background: rgba(255,255,255,0.14); }
      button.on { background: #2f6feb; border-color: #2f6feb; }
      #stats { margin-top: 10px; font-size: 10px; color: #6e7d8f; font-variant-numeric: tabular-nums; }
      #ref { position: fixed; bottom: 14px; left: 14px; z-index: 10; width: 180px;
             border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; }
      #ref img { display: block; width: 100%; }
      #ref span { position: absolute; top: 0; left: 0; background: rgba(0,0,0,.6);
                  color: #fff; font-size: 9px; padding: 2px 6px; }
      #ref.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1 id="title">—</h1>
      <p id="blurb">—</p>
      <div class="row" id="models"></div>
      <div class="sep"></div>
      <div class="row">
        <button id="v-ref" class="on">Reference view</button>
        <button id="v-34">3/4</button>
        <button id="v-side">Side</button>
        <button id="v-rear">Rear</button>
        <button id="v-top">Top</button>
      </div>
      <div class="row">
        <button id="t-wire">Wireframe</button>
        <button id="t-ctx" class="on">Context</button>
        <button id="t-ref" class="on">Ref image</button>
      </div>
      <div id="stats"></div>
    </div>
    <div id="ref"><img id="refimg" src="" alt="reference photograph" /><span>REFERENCE</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
